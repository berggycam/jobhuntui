<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore compensation data for top tech jobs.">
    <title>Elevate - Salary Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css">
</head>

<body>
    <div id="app">
        <!-- Navbar -->
        <nav id="navbar" class="navbar glass">
            <div class="nav-container">
                <div class="nav-brand">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L2 7L12 12M2 17L12 22L22 17" stroke="url(#gradient)" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M2 12L12 17L22 12" stroke="url(#gradient)" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <defs>
                            <linearGradient id="gradient" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#4F46E5" />
                                <stop offset="1" stop-color="#EC4899" />
                            </linearGradient>
                        </defs>
                    </svg>
                    <span class="brand-text">Elevate</span>
                </div>
                <div class="nav-links">
                    <a href="/" class="nav-link">Find Jobs</a>
                    <a href="/companies.html" class="nav-link">Companies</a>
                    <a href="/salaries.html" class="nav-link active">Salaries</a>
                </div>
                <div class="nav-actions">
                    <button class="icon-btn" aria-label="Notifications" id="btn-notifications">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                    </button>
                    <div class="user-avatar" id="user-profile">
                        <img src="https://ui-avatars.com/api/?name=John+Doe&background=4F46E5&color=fff"
                            alt="User Avatar">
                    </div>
                </div>
            </div>
        </nav>

        <!-- Hero Section -->
        <header id="hero" class="hero">
            <div class="hero-content">
                <h1 class="hero-title">Explore Tech <span class="text-gradient">Salaries</span></h1>
                <p class="hero-subtitle">Know your worth. Discover accurate compensation data across roles and
                    locations.</p>

                <div class="search-container glass-strong">
                    <div class="search-input-group">
                        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="1" x2="12" y2="23"></line>
                            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                        </svg>
                        <input type="text" id="salary-search-input" placeholder="Role (e.g., Software Engineer)">
                    </div>
                    <button class="btn btn-primary primary-gradient" id="search-btn">
                        Search Roles
                    </button>
                </div>
            </div>
            <div class="hero-bg-shapes">
                <div class="shape shape-1" style="background: rgba(245, 158, 11, 0.15);"></div>
                <div class="shape shape-2" style="background: rgba(139, 92, 246, 0.1);"></div>
            </div>
        </header>

        <!-- Main Content -->
        <main id="main-content" class="main-layout" style="display: block; max-width: 1000px;">
            <section class="listings">
                <div class="listings-header">
                    <h2 class="results-title" style="margin-bottom: 2rem;">Top Paying Roles</h2>
                </div>

                <div class="salary-list" id="salaries-container">
                    <!-- Salary items will be injected here by JS -->
                </div>
            </section>
        </main>
    </div>
    <script type="module" src="/src/salaries.js"></script>
</body>

</html>
