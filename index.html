<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Find and apply for premium tech jobs worldwide.">
  <title>Elevate - Premium Job Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>

<body>
  <div id="app">
    <!-- Navbar -->
    <nav id="navbar" class="navbar glass">
      <div class="nav-container">
        <div class="nav-brand">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L2 7L12 12M2 17L12 22L22 17" stroke="url(#gradient)" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
            <path d="M2 12L12 17L22 12" stroke="url(#gradient)" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
            <defs>
              <linearGradient id="gradient" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                <stop stop-color="#4F46E5" />
                <stop offset="1" stop-color="#EC4899" />
              </linearGradient>
            </defs>
          </svg>
          <span class="brand-text">Elevate</span>
        </div>
        <div class="nav-links">
          <a href="/" class="nav-link active">Find Jobs</a>
          <a href="/companies.html" class="nav-link">Companies</a>
          <a href="/salaries.html" class="nav-link">Salaries</a>
        </div>
        <div class="nav-actions">
          <button class="icon-btn" aria-label="Notifications" id="btn-notifications">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
          </button>
          <div class="user-avatar" id="user-profile">
            <img src="https://ui-avatars.com/api/?name=John+Doe&background=4F46E5&color=fff" alt="User Avatar">
          </div>
        </div>
      </div>
    </nav>

    <!-- Hero Section -->
    <header id="hero" class="hero">
      <div class="hero-content">
        <h1 class="hero-title">Discover your <span class="text-gradient">next opportunity</span></h1>
        <p class="hero-subtitle">Explore thousands of job openings and find the perfect role to advance your career.</p>

        <div class="search-container glass-strong">
          <div class="search-input-group">
            <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="job-search-input" placeholder="Job title, keywords, or company">
          </div>
          <div class="divider"></div>
          <div class="search-input-group">
            <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
            <input type="text" id="location-input" placeholder="City, state, or remote">
          </div>
          <button id="search-btn" class="btn btn-primary primary-gradient">
            Search Jobs
          </button>
        </div>
      </div>
      <div class="hero-bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
      </div>
    </header>

    <!-- Main Content -->
    <main id="main-content" class="main-layout">
      <aside id="filters-sidebar" class="sidebar">
        <div class="filter-group">
          <h3 class="filter-title">Job Type</h3>
          <label class="custom-checkbox">
            <input type="checkbox" checked>
            <span class="checkmark"></span>
            Full-time <span class="count">(1,245)</span>
          </label>
          <label class="custom-checkbox">
            <input type="checkbox">
            <span class="checkmark"></span>
            Part-time <span class="count">(203)</span>
          </label>
          <label class="custom-checkbox">
            <input type="checkbox">
            <span class="checkmark"></span>
            Contract <span class="count">(156)</span>
          </label>
          <label class="custom-checkbox">
            <input type="checkbox">
            <span class="checkmark"></span>
            Freelance <span class="count">(84)</span>
          </label>
        </div>

        <div class="filter-group">
          <h3 class="filter-title">Experience Level</h3>
          <label class="custom-checkbox">
            <input type="checkbox">
            <span class="checkmark"></span>
            Entry Level <span class="count">(432)</span>
          </label>
          <label class="custom-checkbox">
            <input type="checkbox" checked>
            <span class="checkmark"></span>
            Mid Level <span class="count">(895)</span>
          </label>
          <label class="custom-checkbox">
            <input type="checkbox">
            <span class="checkmark"></span>
            Senior Level <span class="count">(512)</span>
          </label>
          <label class="custom-checkbox">
            <input type="checkbox">
            <span class="checkmark"></span>
            Executive <span class="count">(45)</span>
          </label>
        </div>

        <div class="filter-group">
          <h3 class="filter-title">Salary Range</h3>
          <div class="range-slider">
            <input type="range" min="0" max="250" value="120" class="slider" id="salary-slider">
            <div class="range-labels">
              <span>$0</span>
              <span id="salary-value">$120k+</span>
            </div>
          </div>
        </div>
      </aside>

      <section id="job-listings" class="listings">
        <div class="listings-header">
          <h2 class="results-title">Recommended Jobs</h2>
          <div class="sort-by">
            <span class="sort-label">Sort by:</span>
            <select id="sort-select" class="sort-select">
              <option value="relevant">Most Relevant</option>
              <option value="recent">Most Recent</option>
              <option value="highest_paid">Highest Paid</option>
            </select>
          </div>
        </div>

        <div id="jobs-container" class="jobs-grid">
          <!-- Job cards will be injected here by JS -->
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
