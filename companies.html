<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Discover top companies hiring right now.">
    <title>Elevate - Top Companies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css">
</head>

<body>
    <div id="app">
        <!-- Navbar -->
        <nav id="navbar" class="navbar glass">
            <div class="nav-container">
                <div class="nav-brand">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L2 7L12 12M2 17L12 22L22 17" stroke="url(#gradient)" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M2 12L12 17L22 12" stroke="url(#gradient)" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <defs>
                            <linearGradient id="gradient" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#4F46E5" />
                                <stop offset="1" stop-color="#EC4899" />
                            </linearGradient>
                        </defs>
                    </svg>
                    <span class="brand-text">Elevate</span>
                </div>
                <div class="nav-links">
                    <a href="/" class="nav-link">Find Jobs</a>
                    <a href="/companies.html" class="nav-link active">Companies</a>
                    <a href="/salaries.html" class="nav-link">Salaries</a>
                </div>
                <div class="nav-actions">
                    <button class="icon-btn" aria-label="Notifications" id="btn-notifications">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                    </button>
                    <div class="user-avatar" id="user-profile">
                        <img src="https://ui-avatars.com/api/?name=John+Doe&background=4F46E5&color=fff"
                            alt="User Avatar">
                    </div>
                </div>
            </div>
        </nav>

        <!-- Hero Section -->
        <header id="hero" class="hero">
            <div class="hero-content">
                <h1 class="hero-title">Discover top <span class="text-gradient">workplaces</span></h1>
                <p class="hero-subtitle">Find the companies that align with your career goals, read reviews, and explore
                    open roles.</p>

                <div class="search-container glass-strong">
                    <div class="search-input-group">
                        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                        <input type="text" id="company-search-input" placeholder="Company name or industry">
                    </div>
                    <button id="search-btn" class="btn btn-primary primary-gradient">
                        Search Companies
                    </button>
                </div>
            </div>
            <div class="hero-bg-shapes">
                <div class="shape shape-1" style="background: rgba(16, 185, 129, 0.15);"></div>
                <div class="shape shape-2" style="background: rgba(59, 130, 246, 0.1);"></div>
            </div>
        </header>

        <!-- Main Content -->
        <main id="main-content" class="main-layout" style="grid-template-columns: 280px 1fr;">
            <aside id="filters-sidebar" class="sidebar">
                <div class="filter-group">
                    <h3 class="filter-title">Industry</h3>
                    <label class="custom-checkbox">
                        <input type="checkbox" checked>
                        <span class="checkmark"></span>
                        Technology <span class="count">(1,245)</span>
                    </label>
                    <label class="custom-checkbox">
                        <input type="checkbox">
                        <span class="checkmark"></span>
                        Finance <span class="count">(432)</span>
                    </label>
                    <label class="custom-checkbox">
                        <input type="checkbox">
                        <span class="checkmark"></span>
                        Healthcare <span class="count">(256)</span>
                    </label>
                    <label class="custom-checkbox">
                        <input type="checkbox">
                        <span class="checkmark"></span>
                        Education <span class="count">(184)</span>
                    </label>
                </div>

                <div class="filter-group">
                    <h3 class="filter-title">Company Size</h3>
                    <label class="custom-checkbox">
                        <input type="checkbox">
                        <span class="checkmark"></span>
                        1 - 50 <span class="count">(320)</span>
                    </label>
                    <label class="custom-checkbox">
                        <input type="checkbox" checked>
                        <span class="checkmark"></span>
                        51 - 200 <span class="count">(895)</span>
                    </label>
                    <label class="custom-checkbox">
                        <input type="checkbox">
                        <span class="checkmark"></span>
                        201 - 1000 <span class="count">(512)</span>
                    </label>
                    <label class="custom-checkbox">
                        <input type="checkbox">
                        <span class="checkmark"></span>
                        1000+ <span class="count">(845)</span>
                    </label>
                </div>
            </aside>

            <section class="listings">
                <div class="listings-header">
                    <h2 class="results-title">Trending Companies</h2>
                </div>

                <div id="companies-container" class="jobs-grid">
                    <!-- Company cards will be injected here by JS -->
                </div>
            </section>
        </main>
    </div>
    <script type="module" src="/src/companies.js"></script>
</body>

</html>
